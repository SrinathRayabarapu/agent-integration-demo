spring.main.web-application-type=none

# Local Ollama (default) — no cloud credentials required
spring.ai.model.chat=ollama
spring.ai.model.embedding=ollama
spring.ai.ollama.base-url=http://localhost:11434
# llama3.2 has reliable native tool_calls in Ollama (needed for tools/MCP/HITL demos)
spring.ai.ollama.chat.model=llama3.2
spring.ai.ollama.chat.options.num-predict=5000
spring.ai.ollama.embedding.model=nomic-embed-text

# Public MCP endpoint used by the mcpTools demo (no auth token in this project)
spring.ai.mcp.client.streamable-http.connections.javadocs.url=https://www.javadocs.dev/mcp

logging.level.io.modelcontextprotocol.client.LifecycleInitializer=OFF
