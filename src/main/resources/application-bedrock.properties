# Activate with: ./gradlew <demo> -Pllm=bedrock
# Requires a shell env var only — never commit tokens:
#   export AWS_BEARER_TOKEN_BEDROCK=YOUR_TOKEN
spring.ai.model.chat=bedrock-converse
spring.ai.model.embedding=bedrock-titan
spring.ai.bedrock.converse.chat.options.model=us.amazon.nova-pro-v1:0
spring.ai.bedrock.converse.chat.options.max-tokens=5000
spring.ai.bedrock.titan.embedding.model=amazon.titan-embed-text-v1
spring.ai.bedrock.titan.embedding.input-type=text
